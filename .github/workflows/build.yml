name: Build Native Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        unzip -o source/source.zip

    - name: Download & Setup NDK r21e
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip
        echo "NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r21e" >> $GITHUB_ENV
        echo "$GITHUB_WORKSPACE/android-ndk-r21e" >> $GITHUB_PATH

    - name: Run ndk-build
      run: |
        ndk-build

    - name: Upload Native Libs (.so)
      uses: actions/upload-artifact@v4
      with:
        name: samp-native-libs
        path: libs/
